[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ftl-voice-prompt-sidecar"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "numpy>=1.26.0",
  "pydantic>=2.8.0",
  "qwen-asr>=0.0.6,<0.1.0",
  "funasr>=1.3.0,<1.4.0",
  "torchaudio>=2.8.0,<2.9.0",
  "sounddevice>=0.4.7",
  "soundfile>=0.12.1",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "httpx>=0.28.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
