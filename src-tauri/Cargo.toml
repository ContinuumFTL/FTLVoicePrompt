[package]
name = "ftl-voice-prompt"
version = "0.1.0"
description = "Windows-first voice prompt input panel"
license = "MIT"
authors = ["FTL Voice Prompt"]
edition = "2021"

[lib]
name = "ftl_voice_prompt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
arboard = "3.4.0"
chrono = { version = "0.4.38", features = ["serde"] }
directories = "5.0.1"
keyring = { version = "3.2.0", features = ["windows-native"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tauri = { version = "2.6.2", features = [] }
tauri-plugin-global-shortcut = "2.3.0"
tauri-plugin-opener = "2.2.7"
tauri-plugin-shell = "2.3.0"
thiserror = "1.0.63"
tokio = { version = "1.38.0", features = ["process", "time", "sync"] }
windows = { version = "0.58.0", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
tempfile = "3.10.1"
